name: News API monitor

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      notification_test:
        description: 'Send a clearly labelled test Issue (no simulated outage)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.upptimerc.yml'
      - '.github/workflows/uptime.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - '.upptimerc.yml'
      - '.github/workflows/uptime.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: news-api-monitor
  cancel-in-progress: false

jobs:
  regression:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Local HTTP and incident regressions (no production probes or email)
        run: node --test scripts/*.test.mjs
  monitor:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Healthy runs stay short. A new failure waits 120s and probes again, so
    # the worst case needs more than the previous 5 minute cap.
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out status metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm endpoint failures and recovery; update one project incident
        run: node scripts/project-monitor.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_SAMPLE: ${{ github.event.schedule == '17 */6 * * *' }}
      - name: Save confirmed status changes and six-hour samples
        run: |
          git add history/project.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update confirmed public API status [skip ci]'
            git push origin HEAD:main
          fi
      - name: Test Issue notifications on request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notification_test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --assignee bazz1111 --title '通知演练：GitHub Actions 监控通知（非实际故障）' --body-file .github/notification-test.md
