name: News API monitor

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.upptimerc.yml'
      - '.github/workflows/uptime.yml'

permissions:
  contents: read

concurrency:
  group: news-api-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out status metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Check public APIs with Upptime
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b # v1.46.0
        with:
          command: ${{ github.event.schedule == '17 */6 * * *' && 'response-time' || 'update' }}
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
